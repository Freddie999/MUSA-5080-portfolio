project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - "index.qmd"
    - "about.qmd"
    - "projects.qmd"
    - "coursework.qmd"
    - "assignments/index.qmd"
    - "assignments/assignment2.qmd"
    - "assignments/assignment3.qmd"
    - "assignments/assignment4.qmd"
    - "assignments/assignment5.qmd"
    - "weekly-notes/*.qmd"
  resources:
    - "reports/*.html"

website:
  title: "Frederick Abalo"
  description: "Geospatial software, mapping infrastructure, backend systems, and urban spatial analytics."
  navbar:
    title: "Frederick Abalo"
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - text: Coursework
        menu:
          - href: coursework.qmd
            text: Overview
          - href: assignments/index.qmd
            text: Assignments
          - href: weekly-notes/index.qmd
            text: Weekly Notes
      - href: about.qmd
        text: About
    right:
      - icon: github
        text: GitHub
        href: https://github.com/Freddie999
      - icon: linkedin
        text: LinkedIn
        href: https://www.linkedin.com/in/frederick-abalo-782054ba/
  page-footer:
    left: "Frederick Abalo · Geospatial software & urban spatial analytics"
    right:
      - text: Email
        href: mailto:frederick.abalo@icloud.com
      - text: Site source
        href: https://github.com/Freddie999/MUSA-5080-portfolio

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    code-fold: false
    code-tools: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

filters:
  - filters/coursework-image-alt.lua
